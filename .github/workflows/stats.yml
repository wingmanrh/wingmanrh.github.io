# Wingman landing-page stat refresher — drop into the HOSTING repo as
# .github/workflows/stats.yml (alongside index.html + tools/update_stats.py).
# Same zero-backend pattern as the frong-ledger site: Actions cron rewrites the
# static file and pushes; Pages redeploys automatically.
#
# The updater script refuses to write if the API response fails sanity checks,
# so an API breakage turns the run red instead of blanking the page.
name: refresh-stats
on:
  schedule:
    - cron: "23 */6 * * *"   # every 6h (offset minute to dodge cron-storm delays)
  workflow_dispatch:          # manual run button
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: update numbers
        run: python3 tools/update_stats.py index.html
      - name: commit if changed
        run: |
          git config user.name "wingman-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "stats: refresh from pools.trade API"
          git push
